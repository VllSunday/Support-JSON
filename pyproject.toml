[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-json-capstone"
version = "0.1.0"
description = "Russian policy-conditioned support: reproducible pilot data and evaluation"
requires-python = ">=3.10,<3.13"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
soup = ["soup-cli==0.75.0"]
tokenizer = ["transformers>=5,<6", "jinja2>=3.1,<4"]

[project.scripts]
support-json = "support_json.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_json = ["resources/*.json", "resources/*.txt"]
